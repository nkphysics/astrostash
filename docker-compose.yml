services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: astrostash
      POSTGRES_PASSWORD: astrostash_test
      POSTGRES_DB: astrostash_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrostash"]
      interval: 5s
      timeout: 5s
      retries: 5
