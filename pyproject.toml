[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrostash"
version = "0.2.3"
description = "An astronomy/astrophysics database building and syncing library"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Nicholas Kuechel", email = "njkuechel@protonmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "astroquery >= 0.4.10",
    "pandas >= 2.3.0",
    "SQLAlchemy >= 2.0.43",
]

[tool.setuptools.package-data]
"astrostash" = ["schema/*.sql"]

[tool.pytest.ini_options]
markers = [
    "table_schemas: validates HEASARC catalog table schemas for astrostash compatibility",
    "remote: tests that require network access to HEASARC services",
    "postgres: tests requiring a live PostgreSQL instance",
]
addopts = "-m 'not table_schemas and not remote and not postgres'"

[project.optional-dependencies]
postgres = ["psycopg2 >= 2.9.12"]
dev = [
    "build >= 0.10.0",
    "pytest >= 8.4.1",
    "pytest-cov >= 6.2.1",
    "pytest-mock >= 3.0.0",
    "flake8 >= 7.3.0",
]
